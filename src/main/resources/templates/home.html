<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Bienvenue</h2>
    <p class="subtitle">Connexion réussie ! Choisissez votre espace :</p>

    <a class="btn" th:href="@{/user/dashboard}">Espace Utilisateur</a>

    </form>

</html>
